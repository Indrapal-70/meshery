name: Scoop Uninstall Test
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scoop:
    name: Verify Scoop Package Lifecycle
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Install Scoop
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE "scoop" }
          $shimDir = Join-Path $scoopRoot "shims"
          if (-not (Test-Path $shimDir)) {
            Write-Error "Scoop shims directory not found at $shimDir"
            exit 1
          }
          echo "$shimDir" >> $env:GITHUB_PATH

      - name: Add Meshery Scoop Bucket
        run: |
          scoop bucket add mesheryctl https://github.com/meshery/scoop-bucket.git
          Write-Host "Current Scoop buckets:"
          scoop bucket list

      - name: Install mesheryctl (with retry)
        run: |
          $maxAttempts = 5
          $attempt = 0
          $success = $false
          while ($attempt -lt $maxAttempts -and -not $success) {
            $attempt++
            Write-Host "Attempt $attempt of $maxAttempts: Updating Scoop and installing mesheryctl..."
            scoop update 2>&1 | Out-Null
            scoop install mesheryctl

            $cmdFound = Get-Command mesheryctl -ErrorAction SilentlyContinue
            $scoopListOut = scoop list mesheryctl 2>&1 | Out-String
            $inScoopList = $scoopListOut -match "mesheryctl"

            if ($cmdFound -or $inScoopList) {
              $success = $true
              Write-Host "Successfully installed mesheryctl on attempt $attempt."
            } else {
              if ($attempt -lt $maxAttempts) {
                Write-Host "Install did not yield mesheryctl binary. Waiting 30 seconds before retrying..."
                Start-Sleep -Seconds 30
              }
            }
          }
          if (-not $success) {
            Write-Error "Failed to install mesheryctl after $maxAttempts attempts."
            exit 1
          }

      - name: Verify mesheryctl installation on PATH and in scoop list
        run: |
          $cmd = Get-Command mesheryctl -ErrorAction SilentlyContinue
          $scoopListOut = scoop list mesheryctl 2>&1 | Out-String
          $inScoopList = $scoopListOut -match "mesheryctl"
          if (-not $cmd -or -not $inScoopList) {
            Write-Error "Pre-uninstall check failed: mesheryctl on PATH or in scoop list missing."
            exit 1
          }
          Write-Host "Found mesheryctl at $($cmd.Source) and in scoop list."
          mesheryctl --help

      - name: Uninstall mesheryctl and verify removal
        run: |
          scoop uninstall mesheryctl
          $cmd = Get-Command mesheryctl -ErrorAction SilentlyContinue
          $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE "scoop" }
          $shimExe = Join-Path $scoopRoot "shims\mesheryctl.exe"
          $shimPs1 = Join-Path $scoopRoot "shims\mesheryctl.ps1"
          $shimCmd = Join-Path $scoopRoot "shims\mesheryctl.cmd"
          $shimExists = (Test-Path $shimExe) -or (Test-Path $shimPs1) -or (Test-Path $shimCmd)
          $scoopListOut = scoop list mesheryctl 2>&1 | Out-String
          $stillInScoopList = $scoopListOut -match "mesheryctl"
          if ($cmd -or $shimExists -or $stillInScoopList) {
            Write-Error "mesheryctl was still found after uninstall (Command on PATH: $($cmd.Source), Shim exists: $shimExists, Scoop list contains: $stillInScoopList)"
            exit 1
          } else {
            Write-Host "Verified: mesheryctl uninstalled successfully and removed from PATH, shims, and scoop list."
          }
